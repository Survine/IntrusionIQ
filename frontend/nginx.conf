server {
    listen 80;

    # Where the built React files live
    root /usr/share/nginx/html;
    index index.html;

    # API calls → forward to backend container
    # Browser calls http://localhost:3000/api/...
    # Nginx forwards it to http://backend:8000/api/...
    # This is called a reverse proxy
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Everything else → SPA fallback
    # Try the exact file → try as directory → fallback to index.html
    # React Router then reads the URL and renders the right page
    location / {
        try_files $uri $uri/ /index.html;
    }
}